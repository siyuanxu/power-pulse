name: PowerPulse
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  PowerPulse:
    type: application
    platform: macOS
    sources:
      - path: Sources/PowerPulse
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Power Pulse
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "7"
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powerpulse.mac
        PRODUCT_NAME: "Power Pulse"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PowerPulseWidget
        embed: true
    scheme:
      gatherCoverageData: false
  PowerPulseWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: PowerPulseWidget
      - path: Sources/PowerPulse/PowerTelemetry.swift
    info:
      path: PowerPulseWidget/Info.plist
      properties:
        CFBundleDisplayName: Power Pulse
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "7"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powerpulse.mac.widget
        PRODUCT_NAME: PowerPulseWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
